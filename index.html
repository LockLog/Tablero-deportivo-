<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏀 Marcador de Básquet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b1a2e 0%, #1b2f44 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .scoreboard {
      max-width: 1000px;
      width: 100%;
      background: #0f1c2b;
      border-radius: 48px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 0 8px rgba(255, 215, 0, 0.2);
      padding: 30px 30px 40px;
      border: 2px solid #3e5a70;
    }
    h1 {
      text-align: center;
      color: #f5e6b0;
      font-weight: 600;
      letter-spacing: 2px;
      font-size: 2.2rem;
      text-transform: uppercase;
      text-shadow: 0 4px 8px #00000055, 0 0 10px #ffd96633;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 span {
      font-size: 2.6rem;
    }

    /* Panel de configuración */
    .config-panel {
      background: #1c2e40;
      padding: 20px 24px;
      border-radius: 100px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px 32px;
      margin-bottom: 32px;
      border: 1px solid #3d5d7a;
      box-shadow: inset 0 2px 6px #00000055, 0 6px 12px #00000030;
    }
    .config-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #d4e3f0;
      font-weight: 500;
    }
    .config-item label {
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #b6d0e8;
    }
    .config-item input {
      background: #0a141f;
      border: 2px solid #3e6080;
      color: #fff;
      padding: 10px 14px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      width: 100px;
      text-align: center;
      outline: none;
      transition: 0.2s;
    }
    .config-item input:focus {
      border-color: #f5c542;
      box-shadow: 0 0 12px #f5c54280;
    }
    .config-item input[type="text"] {
      width: 150px;
      text-align: left;
      padding-left: 16px;
    }
    .config-item input[type="number"] {
      width: 90px;
    }
    .apply-btn {
      background: #f5c542;
      border: none;
      color: #0b1a2e;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 40px;
      font-size: 1rem;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 0 #a07d1a;
      text-transform: uppercase;
    }
    .apply-btn:hover {
      background: #ffd966;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #a07d1a;
    }
    .apply-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a07d1a;
    }

    /* Marcador principal */
    .main-score {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 20px;
      margin-bottom: 30px;
    }
    .team-card {
      flex: 1;
      background: #0b1a2b;
      border-radius: 36px;
      padding: 24px 16px 20px;
      box-shadow: inset 0 0 0 1px #2e4b64, 0 12px 20px #00000050;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .team-name {
      font-size: 1.9rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      word-break: break-word;
      padding: 0 6px;
      margin-bottom: 12px;
      text-shadow: 0 2px 6px black;
      letter-spacing: 1px;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .score {
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      color: #f5e6b0;
      background: #0d1b29;
      padding: 10px 20px;
      border-radius: 30px;
      text-shadow: 0 0 20px #ffd96680, 0 8px 0 #00000060;
      font-variant-numeric: tabular-nums;
      letter-spacing: 6px;
      margin: 6px 0 14px;
      box-shadow: inset 0 -6px 0 #1e3347, 0 12px 20px #00000070;
      width: 100%;
      text-align: center;
      transition: 0.1s;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      width: 100%;
    }
    .score-btn {
      background: #263e54;
      border: none;
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 12px 0;
      width: 75px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 5px 0 #0e1a24, 0 6px 12px black;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .score-btn:hover {
      background: #3a5b78;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #0e1a24, 0 10px 16px black;
    }
    .score-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0e1a24, 0 6px 12px black;
    }
    .score-btn.plus1 {
      background: #2d5f5f;
    }
    .score-btn.plus2 {
      background: #3a6b4a;
    }
    .score-btn.plus3 {
      background: #8b5a2b;
    }
    .reset-team {
      background: #4a2e2e;
      font-size: 1rem;
      padding: 8px 16px;
      width: auto;
      margin-left: 6px;
      box-shadow: 0 4px 0 #1e1111;
    }

    /* Panel central: cuarto y temporizador */
    .game-info {
      background: #0c1926;
      border-radius: 60px;
      padding: 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-width: 220px;
      border: 1px solid #34536b;
      box-shadow: inset 0 0 20px #00000070, 0 12px 24px #00000060;
    }
    .quarter-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.4rem;
      color: #b6d0e8;
      font-weight: 500;
    }
    .quarter-display select {
      background: #1e354a;
      border: 2px solid #3e6080;
      color: white;
      font-weight: 700;
      font-size: 1.5rem;
      padding: 4px 12px;
      border-radius: 40px;
      outline: none;
      cursor: pointer;
    }
    .timer {
      font-size: 3.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #f5e6b0;
      background: #0a141f;
      padding: 4px 20px;
      border-radius: 60px;
      letter-spacing: 6px;
      text-shadow: 0 0 16px #ffd966;
      box-shadow: inset 0 -4px 0 #1e3347, 0 6px 0 #00000060;
      width: 100%;
      text-align: center;
    }
    .timer-controls {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }
    .timer-btn {
      background: #2e4b64;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 12px 24px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 5px 0 #0e1a24;
      letter-spacing: 0.5px;
    }
    .timer-btn:hover {
      background: #3f6382;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #0e1a24;
    }
    .timer-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0e1a24;
    }
    .timer-btn.reset {
      background: #5a3e3e;
    }
    .timer-btn.reset:hover {
      background: #7a5555;
    }

    /* Botón global de reset */
    .global-reset {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }
    .global-reset button {
      background: transparent;
      border: 2px solid #f5c542;
      color: #f5c542;
      font-weight: 700;
      padding: 12px 42px;
      border-radius: 60px;
      font-size: 1.2rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
      text-transform: uppercase;
      box-shadow: 0 0 12px #f5c54240;
    }
    .global-reset button:hover {
      background: #f5c542;
      color: #0b1a2e;
      box-shadow: 0 0 24px #f5c542;
    }

    @media (max-width: 750px) {
      .main-score {
        flex-direction: column;
      }
      .score {
        font-size: 5.5rem;
        letter-spacing: 2px;
      }
      .team-name {
        font-size: 1.5rem;
      }
      .config-panel {
        border-radius: 40px;
        padding: 20px;
        gap: 16px;
      }
      .config-item input[type="text"] {
        width: 120px;
      }
      .timer {
        font-size: 2.8rem;
      }
      .game-info {
        min-width: auto;
        width: 100%;
      }
    }
    @media (max-width: 480px) {
      .score {
        font-size: 4rem;
      }
      .score-btn {
        width: 60px;
        font-size: 1.2rem;
        padding: 10px 0;
      }
      .config-item {
        flex-wrap: wrap;
        justify-content: center;
      }
      .config-item input[type="text"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="scoreboard">
  <h1>
    <span>🏀</span> MARCADOR <span>🏀</span>
  </h1>

  <!-- Panel de configuración: duración y nombres -->
  <div class="config-panel">
    <div class="config-item">
      <label>⏱️ Duración (min):</label>
      <input type="number" id="durationInput" min="1" max="60" value="10" step="1">
    </div>
    <div class="config-item">
      <label>🏠 Local:</label>
      <input type="text" id="teamHomeInput" value="LOCAL" maxlength="18" placeholder="Equipo local">
    </div>
    <div class="config-item">
      <label>✈️ Visitante:</label>
      <input type="text" id="teamAwayInput" value="VISITANTE" maxlength="18" placeholder="Equipo visitante">
    </div>
    <button class="apply-btn" id="applyConfigBtn">Aplicar</button>
  </div>

  <!-- Marcador principal: equipos y puntos -->
  <div class="main-score">
    <!-- Equipo Local -->
    <div class="team-card" id="homeCard">
      <div class="team-name" id="homeNameDisplay">LOCAL</div>
      <div class="score" id="homeScoreDisplay">0</div>
      <div class="btn-group">
        <button class="score-btn plus1" data-team="home" data-points="1">+1</button>
        <button class="score-btn plus2" data-team="home" data-points="2">+2</button>
        <button class="score-btn plus3" data-team="home" data-points="3">+3</button>
        <button class="score-btn reset-team" data-team="home" data-reset="true">↺</button>
      </div>
    </div>

    <!-- Panel central: Cuarto y temporizador -->
    <div class="game-info">
      <div class="quarter-display">
        <span>CUARTO</span>
        <select id="quarterSelect">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">OT</option>
        </select>
      </div>
      <div class="timer" id="timerDisplay">10:00</div>
      <div class="timer-controls">
        <button class="timer-btn" id="startTimerBtn">▶ INICIAR</button>
        <button class="timer-btn reset" id="resetTimerBtn">↺ REINICIAR</button>
      </div>
    </div>

    <!-- Equipo Visitante -->
    <div class="team-card" id="awayCard">
      <div class="team-name" id="awayNameDisplay">VISITANTE</div>
      <div class="score" id="awayScoreDisplay">0</div>
      <div class="btn-group">
        <button class="score-btn plus1" data-team="away" data-points="1">+1</button>
        <button class="score-btn plus2" data-team="away" data-points="2">+2</button>
        <button class="score-btn plus3" data-team="away" data-points="3">+3</button>
        <button class="score-btn reset-team" data-team="away" data-reset="true">↺</button>
      </div>
    </div>
  </div>

  <!-- Reset general -->
  <div class="global-reset">
    <button id="resetAllBtn">Reiniciar todo</button>
  </div>
</div>

<script>
  (function() {
    // --- Estado global ---
    let homeScore = 0;
    let awayScore = 0;
    let quarter = 1;
    let timeRemaining = 600;        // segundos (10 min por defecto)
    let timerInterval = null;
    let isTimerRunning = false;
    let quarterDurationMinutes = 10; // valor por defecto

    // --- Elementos del DOM ---
    const homeNameDisplay = document.getElementById('homeNameDisplay');
    const awayNameDisplay = document.getElementById('awayNameDisplay');
    const homeScoreDisplay = document.getElementById('homeScoreDisplay');
    const awayScoreDisplay = document.getElementById('awayScoreDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const quarterSelect = document.getElementById('quarterSelect');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const resetTimerBtn = document.getElementById('resetTimerBtn');

    const durationInput = document.getElementById('durationInput');
    const teamHomeInput = document.getElementById('teamHomeInput');
    const teamAwayInput = document.getElementById('teamAwayInput');
    const applyConfigBtn = document.getElementById('applyConfigBtn');

    const resetAllBtn = document.getElementById('resetAllBtn');

    // --- Funciones auxiliares ---
    function formatTime(seconds) {
      if (seconds < 0) seconds = 0;
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Actualiza la vista del temporizador
    function updateTimerDisplay() {
      timerDisplay.textContent = formatTime(timeRemaining);
    }

    // Actualiza los marcadores en pantalla
    function updateScoresUI() {
      homeScoreDisplay.textContent = homeScore;
      awayScoreDisplay.textContent = awayScore;
    }

    // Detiene el temporizador si está corriendo
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      isTimerRunning = false;
      startTimerBtn.textContent = '▶ INICIAR';
    }

    // Inicia el temporizador
    function startTimer() {
      if (isTimerRunning) return;
      if (timeRemaining <= 0) {
        // Si no hay tiempo, no iniciar
        return;
      }
      isTimerRunning = true;
      startTimerBtn.textContent = '⏸ PAUSAR';
      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          updateTimerDisplay();
        }
        if (timeRemaining <= 0) {
          stopTimer();
          timeRemaining = 0;
          updateTimerDisplay();
        }
      }, 1000);
    }

    // Pausa / reanuda
    function toggleTimer() {
      if (isTimerRunning) {
        stopTimer();
      } else {
        startTimer();
      }
    }

    // Reinicia el temporizador con la duración actual (quarterDurationMinutes)
    function resetTimer() {
      stopTimer();
      timeRemaining = quarterDurationMinutes * 60;
      updateTimerDisplay();
    }

    // Aplica la duración desde el input (minutos)
    function applyDurationFromInput() {
      let mins = parseInt(durationInput.value, 10);
      if (isNaN(mins) || mins < 1) mins = 1;
      if (mins > 60) mins = 60;
      quarterDurationMinutes = mins;
      durationInput.value = mins;   // normaliza
      // Si el temporizador no está corriendo, actualiza el tiempo restante
      if (!isTimerRunning) {
        timeRemaining = quarterDurationMinutes * 60;
        updateTimerDisplay();
      } else {
        // Si está corriendo, solo cambiamos la duración para el próximo reset,
        // pero no interrumpimos el tiempo actual.
        // Opcional: podríamos reiniciar, pero preferimos no alterar el tiempo en marcha.
        // Para que la duración se refleje en el próximo reset.
      }
    }

    // Aplica los nombres de los equipos
    function applyTeamNames() {
      let homeName = teamHomeInput.value.trim();
      let awayName = teamAwayInput.value.trim();
      if (homeName === '') homeName = 'LOCAL';
      if (awayName === '') awayName = 'VISITANTE';
      // Limitar longitud
      homeName = homeName.substring(0, 18);
      awayName = awayName.substring(0, 18);
      teamHomeInput.value = homeName;
      teamAwayInput.value = awayName;
      homeNameDisplay.textContent = homeName;
      awayNameDisplay.textContent = awayName;
    }

    // --- Manejadores de puntos ---
    function addPoints(team, points) {
      if (team === 'home') {
        homeScore += points;
      } else if (team === 'away') {
        awayScore += points;
      }
      updateScoresUI();
    }

    function resetTeamScore(team) {
      if (team === 'home') {
        homeScore = 0;
      } else if (team === 'away') {
        awayScore = 0;
      }
      updateScoresUI();
    }

    // --- Reset general (marcador, temporizador, cuarto) ---
    function resetAll() {
      stopTimer();
      homeScore = 0;
      awayScore = 0;
      updateScoresUI();
      quarter = 1;
      quarterSelect.value = '1';
      // Resetear tiempo según duración actual
      timeRemaining = quarterDurationMinutes * 60;
      updateTimerDisplay();
      // Los nombres no se resetean porque son configurables
    }

    // --- Inicialización ---
    function init() {
      // Leer duración inicial del input (10)
      quarterDurationMinutes = parseInt(durationInput.value, 10) || 10;
      timeRemaining = quarterDurationMinutes * 60;
      updateTimerDisplay();

      // Nombres iniciales
      applyTeamNames();

      // Puntuaciones
      homeScore = 0;
      awayScore = 0;
      updateScoresUI();

      // Cuarto
      quarter = 1;
      quarterSelect.value = '1';

      // Eventos de botones de puntuación
      document.querySelectorAll('.score-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const team = btn.dataset.team;
          if (btn.dataset.reset === 'true') {
            resetTeamScore(team);
          } else {
            const points = parseInt(btn.dataset.points, 10);
            addPoints(team, points);
          }
        });
      });

      // Eventos del temporizador
      startTimerBtn.addEventListener('click', toggleTimer);
      resetTimerBtn.addEventListener('click', resetTimer);

      // Cambio de cuarto
      quarterSelect.addEventListener('change', (e) => {
        quarter = parseInt(e.target.value, 10);
        // No modificamos el tiempo automáticamente, pero podríamos resetear.
        // Decisión: al cambiar cuarto, se reinicia el temporizador con la duración actual.
        stopTimer();
        timeRemaining = quarterDurationMinutes * 60;
        updateTimerDisplay();
      });

      // Aplicar configuración (duración + nombres)
      applyConfigBtn.addEventListener('click', () => {
        applyDurationFromInput();
        applyTeamNames();
        // Si el temporizador no está corriendo, actualizar tiempo restante
        if (!isTimerRunning) {
          timeRemaining = quarterDurationMinutes * 60;
          updateTimerDisplay();
        }
        // Si está corriendo, solo se actualiza la duración para el próximo reset.
      });

      // Reset general
      resetAllBtn.addEventListener('click', resetAll);

      // Resetear temporizador si se cambia la duración manualmente y luego se aplica
      // (ya cubierto por applyDurationFromInput)

      // Si se cambia el input de duración pero no se aplica, no afecta hasta pulsar aplicar.
      // Adicional: al presionar Enter en los inputs de configuración, aplicar.
      [durationInput, teamHomeInput, teamAwayInput].forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyConfigBtn.click();
          }
        });
      });
    }

    // Arrancar
    init();
  })();
</script>
</body>
</html>
